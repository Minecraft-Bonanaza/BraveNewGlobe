[interior_clouds]
	#Master toggle for the interior cloud effect.
	enabled = true
	#Hide the normal SimpleClouds mesh when the camera is inside the cloud volume.
	suppressMesh = true
	#Also hide the transparent cloud pass while inside the cloud volume.
	suppressTransparentMesh = true
	#Make vanilla terrain fog denser while the camera is inside the cloud volume.
	modifyFog = true
	#Tint fog toward a soft cloud color while inside the cloud volume.
	modifyFogColor = true
	#Interior strength needed before the mesh is suppressed. Lower hides sooner near cloud edges.
	# Default: 0.18
	# Range: 0.0 ~ 1.0
	meshSuppressionThreshold = 0.18
	#Target fog start in blocks at full interior strength.
	# Default: -4.0
	# Range: -64.0 ~ 256.0
	fogStart = -4.0
	#Target fog end in blocks at full interior strength.
	# Default: 28.0
	# Range: 1.0 ~ 1024.0
	fogEnd = 28.0
	#How strongly the interior effect tints fog color.
	# Default: 0.75
	# Range: 0.0 ~ 1.0
	fogColorBlend = 0.75
	#Soft fade distance at the top and bottom of the cloud volume, in blocks.
	# Default: 28.0
	# Range: 1.0 ~ 256.0
	verticalFadeBlocks = 28.0
	#Ignore very weak cloud region edge density before applying interior fog.
	# Default: 0.08
	# Range: 0.0 ~ 0.95
	minHorizontalDensity = 0.08
	#Higher values keep the effect weaker near horizontal cloud edges.
	# Default: 1.4
	# Range: 0.25 ~ 8.0
	horizontalDensityPower = 1.4
	#Target interior fog red channel.
	# Default: 0.78
	# Range: 0.0 ~ 1.0
	colorRed = 0.78
	#Target interior fog green channel.
	# Default: 0.82
	# Range: 0.0 ~ 1.0
	colorGreen = 0.82
	#Target interior fog blue channel.
	# Default: 0.86
	# Range: 0.0 ~ 1.0
	colorBlue = 0.86
