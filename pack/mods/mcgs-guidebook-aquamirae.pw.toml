name = "MCG's Guidebook: Aquamirae"
filename = "mcgguide_aquamirae-1.2.0_neoforge.jar"
side = "client"

# CurseForge-exclusive with third-party API distribution disabled (the CF API
# returns metadata but no download URL, so packwiz-installer can't fetch it for
# clients) and not published on Modrinth. Bundled in-repo and served by direct
# URL instead. No [update] block on purpose: prevents `packwiz update` from
# reverting to the undownloadable CurseForge metadata source.

[download]
url = "https://raw.githubusercontent.com/Minecraft-Bonanaza/BraveNewGlobe/main/bundled-jars/mcgguide_aquamirae-1.2.0_neoforge.jar"
hash-format = "sha256"
hash = "bc102d3c8b7ea54d1c3cab770f16fa4adaa749ee52b9125a99ff7c2e733cbcb4"

[option]
optional = true
default = true
description = "Client: Aquamirae pages in the H-key book. Turn off together with MCG Core."
