# Height-patched Big Globe 5.3.2: overworld floor -1024 -> -608, ceiling +896. Core/molten 96-thick
# (75% of default), 32-block stone cap between deep dark and caves, deep dark 128, and deep-ore
# curves rescaled ~x0.63 to fit the shallower stone column (diamonds reach full richness above the
# core again). BG reads its generator + terrain scripts from its own jar every load
# (reload_dimension), so these MUST live inside the jar — datapacks/companion mods can't override it.
# Built from the official 5.3.2 jar via bigGlobeAero/build_patched_jar.py (14 files edited).
# Big Globe by builderb0y (CC BY-NC 4.0); modified for personal-server use, not the vanilla jar.
# No [update] block on purpose: prevents `packwiz update` reverting to the unpatched Modrinth jar.

